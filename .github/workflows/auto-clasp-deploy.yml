name: Auto Clasp Deploy

on:
  push:
    paths:
      - 'Kode.js'
      - 'Code.js'
      - 'index.html'

jobs:
  deploy-clasp:
    name: Deploy Apps Script via clasp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install clasp
        run: |
          npm install -g @google/clasp

      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "CLASPRC_JSON secret not set. Aborting." >&2
            exit 1
          fi
          mkdir -p $HOME
          echo "$CLASPRC_JSON" > $HOME/.clasprc.json
          echo "Wrote clasp credentials to $HOME/.clasprc.json"

      - name: Push to Apps Script
        run: |
          npx clasp push

      - name: Deploy new version
        run: |
          npx clasp deploy --description "Auto Deploy from Roo Code"
